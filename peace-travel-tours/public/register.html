<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an account — Peace Travel and Tours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="/" class="brand">
      <span class="brand-mark">✈</span>
      <span>Peace Travel and Tours<small>ELMHURST · QUEENS, NY</small></span>
    </a>
    <div class="nav-links"><a href="/#services">Services</a><a href="/#contact">Contact</a></div>
    <div class="nav-cta" id="nav-auth-slot"></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Set up a free account so we can send your quote and keep track of your requests.</p>
    <div class="form-msg" id="msg"></div>
    <form id="register-form">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Rashida Begum" required />
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="phone">Phone number <span style="color:var(--ink-faint);font-weight:400;">(optional)</span></label>
        <input type="tel" id="phone" name="phone" placeholder="(347) 000-0000" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
    </form>
    <div class="link-row">Already have an account? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script src="/js/main.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');
  msg.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const payload = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value,
  };

  try {
    await apiFetch('/api/auth/register', { method: 'POST', body: JSON.stringify(payload) });
    window.location.href = '/dashboard.html';
  } catch (err) {
    showMsg(msg, err.message, 'error');
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
